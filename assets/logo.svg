<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="neckbeard logo">
  <!-- neckbeard — the pedantic process guy. Simple flat vector, works on light and dark. -->
  <!-- head -->
  <circle cx="128" cy="124" r="74" fill="#e8c39e"/>
  <!-- beard: full neckbeard wrapping the jaw -->
  <path d="M54 124
           a74 74 0 0 0 148 0
           l14 44
           a92 92 0 0 1 -176 0
           z"
        fill="#6b4a2b"/>
  <path d="M96 168 q32 26 64 0 l-6 30 q-26 18 -52 0 z" fill="#5a3d23"/>
  <!-- mouth gap -->
  <ellipse cx="128" cy="170" rx="17" ry="8" fill="#e8c39e"/>
  <!-- fedora -->
  <path d="M44 92 q84 -26 168 0 l0 12 q-84 18 -168 0 z" fill="#3a3a3a"/>
  <path d="M70 92 q6 -44 58 -44 q52 0 58 44 z" fill="#4a4a4a"/>
  <rect x="70" y="80" width="116" height="12" rx="4" fill="#2b2b2b"/>
  <!-- round glasses -->
  <circle cx="99" cy="128" r="19" fill="none" stroke="#20242a" stroke-width="7"/>
  <circle cx="157" cy="128" r="19" fill="none" stroke="#20242a" stroke-width="7"/>
  <line x1="118" y1="128" x2="138" y2="128" stroke="#20242a" stroke-width="7" stroke-linecap="round"/>
  <line x1="80" y1="126" x2="60" y2="120" stroke="#20242a" stroke-width="6" stroke-linecap="round"/>
  <line x1="176" y1="126" x2="196" y2="120" stroke="#20242a" stroke-width="6" stroke-linecap="round"/>
  <!-- lens glint -->
  <path d="M90 118 a12 12 0 0 1 10 -6" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M148 118 a12 12 0 0 1 10 -6" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
</svg>
