# Deterministic gates: schema validation + STATUS freshness (ADR-0004).
validate:
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # Both positive controls build a throwaway git repository, and the slim
    # image has no git. Without this they crash instead of asserting — which
    # is what the first observed pipeline showed, the moment the config
    # parsed for the first time (see docs/aar/2026-08-21-the-parse-was-not-the-run.md).
    - apt-get update -qq && apt-get install -qq -y --no-install-recommends git >/dev/null
    - pip install --quiet pyyaml
    - python scripts/validate.py
    - python scripts/gen_status.py --check
    # The harvest check cannot run here — there is no adopter term list in
    # this repo, by design (ADR-0008). Its positive control can, and must:
    # adopters copy this script, so a broken one would ship silently.
    - python scripts/check_harvest.py --selftest
    # The locked check's positive control runs here for the same reason;
    # its real run is the separate `locked` job below, which needs history
    # this job's shallow fetch does not have.
    - python scripts/check_locked.py --selftest
    # The judge's real run needs a ledger to judge, which is per session
    # and not a property of a push. Its positive control belongs here for
    # the same reason as the others: adopters copy the script.
    - python scripts/judge.py --selftest

# The locked-artifact gate (issue 0026): accepted decision records and
# docs/sources are contradicted mechanically, not only in prose.
#
# Its own job, for two reasons. A finding has to be attributable — `validate`
# answering for both schema and locked paths would make a red pipeline
# ambiguous. And this one needs GIT_DEPTH 0: the default fetch is depth 20
# and the base commit of a push can sit outside that, which this check
# reports as an unresolvable range rather than passing.
#
# The base comes from the forge, per case, through `rules`. A case with no
# well-defined base creates no job at all — a declared scope, not a silent
# skip inside the script. Today that means a new branch's first push and tag
# pipelines, where there is nothing to compare against.
locked:
  image: python:3.12-slim
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        LOCKED_BASE: "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BEFORE_SHA != "0000000000000000000000000000000000000000"'
      variables:
        LOCKED_BASE: "$CI_COMMIT_BEFORE_SHA"
  script:
    - apt-get update -qq && apt-get install -qq -y --no-install-recommends git >/dev/null
    - python scripts/check_locked.py --range "$LOCKED_BASE..$CI_COMMIT_SHA"

# Manual vendor refresh for the with-ponytail branch.
# Appears as a play button only in pipelines of that branch.
# Requires CI/CD variable VENDOR_PUSH_TOKEN: a project access token
# with scope write_repository (masked). Opens an MR — never pushes
# to with-ponytail directly; the diff gets reviewed like any change.
vendor-update:
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == "with-ponytail"'
      when: manual
  script:
    - test -n "$VENDOR_PUSH_TOKEN" || { echo "Set CI/CD variable VENDOR_PUSH_TOKEN (project access token, write_repository)"; exit 1; }
    - apt-get update -qq && apt-get install -qq -y --no-install-recommends git ca-certificates >/dev/null
    - pip install --quiet pyyaml
    - git config user.name "neckbeard-vendor-bot"
    - git config user.email "vendor-bot@invalid"
    - bash scripts/vendor-ponytail.sh
    - if [ -z "$(git status --porcelain)" ]; then echo "vendor already up to date"; exit 0; fi
    - python scripts/validate.py
    - HASH=$(grep '^- Commit:' vendor/ponytail/VENDORED.md | awk '{print $3}' | cut -c1-8)
    - BR="vendor/ponytail-update-${HASH}"
    - git checkout -b "$BR"
    - git add -A
    - 'git commit -m "vendor: update ponytail to ${HASH}"'
    - >
      git push "https://oauth2:${VENDOR_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      "HEAD:refs/heads/${BR}"
      -o merge_request.create
      -o merge_request.target=with-ponytail
      -o merge_request.title="vendor: update ponytail to ${HASH}"
      -o merge_request.remove_source_branch
